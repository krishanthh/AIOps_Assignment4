# AI prompt: "Write Prometheus alert expressions for exporter down, stale app
# heartbeat, sustained host CPU/RAM pressure, and BLIP p95 inference latency.
# Use five-second evaluation, bounded labels, and suppress empty histograms."
groups:
  - name: caption-observability
    rules:
      - alert: CaptionApplicationDown
        expr: up{job="caption-app"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: Caption application metrics endpoint is unavailable
          description: 'Check Streamlit and its port 8000 exporter on {{ $labels.instance }}.'
      - alert: CaptionSamplerStale
        expr: time() - caption_heartbeat_timestamp_seconds > 30
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Application resource sampler has stopped updating
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: Host exporter is unavailable
      - alert: HostCpuHigh
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{job="node",mode="idle"}[1m]))) > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Host CPU exceeds 85 percent for one minute
          description: Compare active bulk requests and CPU before increasing CPU threads.
      - alert: HostMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 90
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Host RAM exceeds 90 percent for one minute
      - alert: CaptionLatencyHigh
        expr: (histogram_quantile(0.95, sum by (le, mode) (rate(caption_inference_seconds_bucket[2m]))) > 30) and on (mode) (sum by (mode) (rate(caption_inference_seconds_count[2m])) > 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Caption p95 inference exceeds 30 seconds
