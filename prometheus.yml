global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s
  external_labels:
    coursework: DA3408-A4
rule_files:
  - monitoring/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: caption-app
    static_configs:
      - targets: ['127.0.0.1:8000']
        labels:
          host: coursework-host
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          host: coursework-host
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']
